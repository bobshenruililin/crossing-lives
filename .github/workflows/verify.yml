name: Verify crossing-lives
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run export:portable
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crossing-lives-verification
          path: |
            artifacts/
            playwright-report/
            test-results/
